<script>
(function(){
  const viewerText = document.getElementById("viewer-text");

  let viewers = 200;
  const startTime = Date.now();

  function getTargetByTime(seconds){
    if(seconds < 180){
      return 200 + (seconds / 180) * 650;
    }

    if(seconds < 600){
      return 850 + Math.sin(seconds / 14) * 45;
    }

    if(seconds < 760){
      return 870 + ((seconds - 600) / 160) * 390;
    }

    if(seconds < 1200){
      return 1260 - ((seconds - 760) / 440) * 1060;
    }

    return 200 + Math.sin(seconds / 22) * 25;
  }

  function organicVariation(seconds){
    const random = Math.random();

    if(seconds < 180){
      if(random < 0.68) return Math.floor(Math.random() * 12) + 4;
      if(random < 0.9) return -(Math.floor(Math.random() * 4) + 1);
      return Math.floor(Math.random() * 16) - 4;
    }

    if(seconds < 600){
      if(random < 0.48) return Math.floor(Math.random() * 8) + 1;
      if(random < 0.88) return -(Math.floor(Math.random() * 7) + 1);
      return Math.floor(Math.random() * 18) - 8;
    }

    if(seconds < 760){
      if(random < 0.6) return Math.floor(Math.random() * 11) + 3;
      if(random < 0.85) return -(Math.floor(Math.random() * 6) + 1);
      return Math.floor(Math.random() * 20) - 7;
    }

    if(seconds < 1200){
      if(random < 0.68) return -(Math.floor(Math.random() * 14) + 4);
      if(random < 0.9) return Math.floor(Math.random() * 6) + 1;
      return Math.floor(Math.random() * 16) - 10;
    }

    return Math.floor(Math.random() * 8) - 4;
  }

  function updateViewers(){
    const seconds = (Date.now() - startTime) / 1000;
    const target = getTargetByTime(seconds);

    const difference = target - viewers;
    const smoothStep = difference * 0.10;

    viewers += smoothStep + organicVariation(seconds);

    let minLimit = 180;
    let maxLimit = 1280;

    if(seconds < 180){
      maxLimit = 930;
    } else if(seconds < 600){
      minLimit = 780;
      maxLimit = 925;
    } else if(seconds < 760){
      minLimit = 850;
      maxLimit = 1280;
    } else if(seconds < 1200){
      minLimit = 190;
      maxLimit = 1280;
    } else {
      minLimit = 170;
      maxLimit = 260;
    }

    viewers = Math.max(minLimit, Math.min(maxLimit, viewers));

    viewerText.textContent = `${Math.round(viewers)} personas viendo ahora`;

    const nextUpdate = Math.floor(Math.random() * 1300) + 900;
    setTimeout(updateViewers, nextUpdate);
  }

  viewerText.textContent = `${Math.round(viewers)} personas viendo ahora`;

  setTimeout(updateViewers, 700);
})();
</script>
